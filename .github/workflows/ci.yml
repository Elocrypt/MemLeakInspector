name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Vintage Story server assemblies
        run: |
          set -e
          mkdir -p "$HOME/vs"
          curl -fL -o vs.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.2.tar.gz"
          tar -xzf vs.tar.gz -C "$HOME/vs"
          echo "VINTAGE_STORY=$HOME/vs" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore MemLeakInspector.sln

      - name: Build
        run: dotnet build MemLeakInspector.sln --configuration Release --no-restore /p:DeployMod=false

      - name: Test
        run: dotnet test MemLeakInspector.sln --configuration Release --no-build --verbosity normal
